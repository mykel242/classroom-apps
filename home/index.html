<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a5f9e">
<title>Classroom Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="../shared/classroom.css">
<style>
/* Layout: sticky header (class filter, tabs) over a scrolling page; editors open as bottom sheets */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
main{gap:12px;padding-top:0}
#view{display:flex;flex-direction:column;gap:12px}
#clsBtn{min-height:44px;justify-content:flex-start;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font:700 17px var(--sans);flex:1;min-width:0}
#clsBtn i{font-style:normal;margin-left:auto;color:var(--muted);font-size:14px}
.iconbtn{min-height:44px;min-width:44px;padding:0;font-size:22px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.tabs{display:flex}.tabs button{flex:1;padding:0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:16px}
.sec{display:flex;align-items:center;gap:8px;margin-top:4px}
.sec h2{flex:1;font-size:18px}
.meta{font-size:14px;color:var(--muted)}
.tag{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.over{border-color:var(--not);color:var(--not)}.tag.due{border-color:var(--part);color:var(--part)}.tag.ok{border-color:var(--got);color:var(--got)}
.tag.parent,.tag.area{border-color:var(--accent);color:var(--accent)}.tag.behavior{border-color:var(--not);color:var(--not)}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow button,.btnrow .btn{min-height:42px;font-size:15px;padding:0 14px}
/* today */
.weekbar{display:flex;align-items:center;gap:8px}
.weekbar h2{flex:1;font-size:19px}
.weekbar button{min-height:44px;min-width:44px;padding:0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg);text-decoration:none;min-height:0;font-weight:500;text-align:left}
.tile b{font:700 28px var(--mono);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.alert b{color:var(--not)}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}}
.day{gap:6px}
.day.today{border:2px solid var(--accent)}
.dayhead{display:flex;align-items:baseline;gap:8px}
.dayhead h3{flex:1}
.who{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.who:first-of-type{border-top:0;padding-top:0}
.who .nm{font-weight:700;background:none;border:0;color:var(--fg);padding:0;min-height:0;justify-content:flex-start;font-size:16px}
.gl{display:flex;gap:8px;align-items:center;width:100%;background:var(--sunk);border:0;border-radius:10px;padding:8px 10px;color:var(--fg);text-align:left;font-weight:400;min-height:44px;justify-content:flex-start}
.gl .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it{display:flex;gap:8px;align-items:baseline;font-size:15px;padding:4px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);width:100%;min-height:0;border-radius:0;justify-content:flex-start;font-weight:400}
.it:first-of-type{border-top:0}
.it .k{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:64px}
.it .v{flex:1;min-width:0}
.it .v small{color:var(--muted)}
.done{font-size:14px;color:var(--muted)}
/* students */
.rowbtn{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--fg);text-align:left;font:500 16px var(--sans);justify-content:flex-start}
.rowbtn .grow{min-width:0}
.prof-h{display:flex;gap:10px;align-items:flex-start}
.prof-h h2{font-size:22px}
.facts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.goal .stmt{font-size:16px;line-height:1.4}
.res{display:flex;gap:4px;flex-wrap:wrap}
.res span{font:600 12px var(--mono);border-radius:6px;padding:2px 6px;background:var(--sunk)}
.res .y{color:var(--got)}.res .n{color:var(--not)}
.acc{display:flex;flex-wrap:wrap;gap:6px}
.acc span{background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:14px}
.acc span small{color:var(--muted)}
.stu{text-align:left;align-items:stretch;justify-content:flex-start;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font-weight:400;min-height:0}
.clshead{font:700 15px var(--sans);margin:8px 2px 0}
textarea.notes{width:100%;min-height:120px;font:15px var(--sans);line-height:1.45}
/* activity */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;min-height:40px;padding:0 14px;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font-weight:500}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
.datehead{font:700 13px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.entry{text-align:left;align-items:stretch;justify-content:flex-start;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font-weight:400;min-height:0}
.entry .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry .whos{font-weight:700;flex:1;min-width:0}
.entry .sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.fu{font-size:14px;display:flex;gap:6px;align-items:center}
/* sheets */
.sheet h2{margin:2px 6px 4px}
.sheet .field{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.sheet .field label,.lbl{font-size:13px;color:var(--muted);font-weight:600}
.sheet textarea{min-height:80px;font:16px var(--sans);line-height:1.4}
.sheet .seg{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:42px;padding:0 12px;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font-weight:500}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
.chips .sug{border-style:dashed;color:var(--accent)}
.nums{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.nums input{width:80px}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 6px}
.items .row{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 12px;border-top:1px solid var(--line)}
.items .row:first-child{border-top:0}
.items .row .t{flex:1;min-width:0}
.items .row input{width:100%;min-height:40px;padding:6px 10px;font-size:15px}
.x{min-height:40px;padding:0 10px;background:none;border:0;color:var(--muted);font-size:14px}
.x.sure{background:var(--not);color:var(--onaccent)}
.mrow{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 6px}
.mrow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mrow .nm{font-weight:700}
.mrow .gt{font-size:14px;color:var(--muted)}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-height:44px;min-width:44px;padding:0;font-size:22px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.step output{font:700 22px var(--mono);min-width:2ch;text-align:center}
.pct{font:700 18px var(--mono);min-width:5ch;text-align:right}
.pct.hit{color:var(--got)}
.hist{display:flex;flex-direction:column;padding:0 6px}
.hist .h{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 2px;font-size:15px}
.hist .h:first-child{border-top:0}
.hist .d{font:600 13px var(--mono);color:var(--muted);width:7ch}
.hist .r{font:700 15px var(--mono);width:9ch}
.hist .t{flex:1;min-width:0}
.note{border-radius:12px;padding:10px 12px;background:var(--sunk);font-size:15px}
.note.bad{border:1.5px solid var(--not);background:transparent;color:var(--not);font-weight:600}
.sticky-actions{position:sticky;bottom:0;background:var(--card);padding:10px 6px 2px;display:flex;gap:10px}
.sticky-actions button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 15px var(--sans)}
#printout{display:none}
@media print{
  html,body{height:auto;background:#fff}
  body>*{display:none!important}
  #printout{display:block!important;font:12px var(--sans);color:#000}
  #printout h1{font-size:17px;margin:0 0 4px}
  #printout h2{font-size:14px;margin:14px 0 4px}
  #printout p{margin:2px 0}
  #printout table{border-collapse:collapse;width:100%;margin:6px 0 10px}
  #printout th,#printout td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="bar">
      <button type="button" id="clsBtn" aria-label="Class"></button>
      <button type="button" class="iconbtn" id="menuBtn" aria-label="More">⋯</button>
    </div>
    <div class="seg tabs" id="tabs">
      <button type="button" data-t="today" aria-pressed="true">Today</button>
      <button type="button" data-t="students" aria-pressed="false">Students</button>
      <button type="button" data-t="bank" aria-pressed="false">Goal bank</button>
      <button type="button" data-t="activity" aria-pressed="false">Activity</button>
    </div>
  </div>
  <div id="view"></div>
</main>

<div class="scrim" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="printout"></div>

<script src="../shared/classroom.js"></script>
<script src="../shared/iepcore.js"></script>
<script src="main.js"></script>
<script src="students.js"></script>
<script src="activity.js"></script>
<script src="report.js"></script>
<script src="backup.js"></script>
<script>render();</script>
<script src="../shared/version.js"></script>
<script src="../shared/app.js"></script>
</body>
</html>
