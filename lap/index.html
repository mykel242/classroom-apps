<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2a5f9e">
<title>Math Lap Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="../shared/classroom.css">
<style>
/* One screen, no page scroll: header, lap bar, seats (fill), dock */
.shell{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:10px;padding-left:max(14px, env(safe-area-inset-left,0px));padding-right:max(14px, env(safe-area-inset-right,0px))}
.top{display:flex;gap:8px;align-items:center}
.top select{min-height:44px;font-size:16px;padding:6px 10px}
#where{flex:1;min-width:0;min-height:44px;justify-content:flex-start;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font:700 17px var(--sans);padding:0 12px}
#where span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#where em{font-style:normal;font-weight:500;color:var(--muted)}
#where i{font-style:normal;margin-left:auto;color:var(--muted);font-size:14px}
.sheet .cls{margin:10px 6px 2px;font:700 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .item[aria-current="true"]{background:var(--sunk);font-weight:700}
.sheet .item[aria-current="true"]::after{content:"✓";margin-left:auto;color:var(--accent)}
.iconbtn{min-height:44px;min-width:44px;padding:0;font-size:22px;position:relative;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--not)}
.lapbar{display:flex;gap:8px;align-items:center}
.lapno{font:700 18px var(--sans);white-space:nowrap}
.lapno.past{color:var(--part)}
#q{flex:1;min-width:0;min-height:48px}
#backcur,#lockbtn{min-height:44px;padding:0 12px;font-size:15px}
.lapno.editing{color:var(--not)}
#lockbtn.on{background:var(--not);border-color:var(--not);color:var(--onaccent)}
#q[readonly]{background:var(--sunk);color:var(--muted)}
#seats.locked .seat{cursor:default}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 15px var(--sans);box-shadow:0 4px 16px rgb(0 0 0 / .2)}
.editbanner{display:flex;gap:10px;align-items:center;background:var(--accent);color:var(--onaccent);border-radius:12px;padding:6px 6px 6px 14px;font-weight:600}
.editbanner button{min-height:40px;background:var(--onaccent);color:var(--accent);border:0}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#seats{flex:1;min-height:0}
.dock{display:flex;flex-direction:column;gap:8px}
.tally{display:flex;gap:6px;font:600 15px var(--sans);font-variant-numeric:tabular-nums}
.tally button{flex:1;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:flex;justify-content:space-between;align-items:baseline;color:var(--fg);font:600 15px var(--sans)}
.tally button[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-3px;background:var(--sunk)}
#seats.filtering .seat.dim{opacity:.18}
.tally b{font:700 20px var(--mono)}
.tally .g b{color:var(--got)}.tally .p b{color:var(--part)}.tally .x b{color:var(--not)}
.tally em{font-style:normal;color:var(--muted);font-weight:500;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;max-width:180px;min-height:52px;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;
  padding:4px 12px;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font-weight:500;text-align:left}
.chip .t1{font:700 13px var(--sans);display:flex;gap:6px;align-items:center;width:100%}
.chip .t1 i{font-style:normal;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.chip .t2{font-size:13px;color:var(--muted);max-width:156px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-3px}
.editor{display:flex;flex-direction:column;gap:8px}
.editor .seg button{min-height:38px;font-size:14px}
.pickgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;align-content:flex-start}
.pickgrid h4{flex-basis:100%;margin:4px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pickgrid button{min-height:46px;padding:0 14px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.pickgrid button.seated{font-weight:500;color:var(--muted)}
.pickgrid button.here{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.pickgrid button small{font:600 11px var(--mono);opacity:.8}
#csv{width:100%;font:13px var(--mono)}
#printout{display:none}
@media print{
  :root{--bg:#fff;--fg:#000;--card:#fff;--line:#999;--muted:#444}
  html,body{height:auto}
  body>*{display:none!important}
  #printout{display:block!important;font:12px var(--sans);color:#000}
  #printout h1{font-size:16px;margin:0 0 6px}
  #printout table{border-collapse:collapse;width:100%}
  #printout th,#printout td{border:1px solid #999;padding:3px 5px;text-align:center;vertical-align:top}
  #printout td.l,#printout th.l{text-align:left}
  #printout th small{display:block;font-weight:400;max-width:110px;margin:0 auto}
  #printout tfoot td{font-weight:700}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <button type="button" id="where" aria-label="Class and room"></button>
    <select id="day" aria-label="Day"></select>
    <button class="iconbtn" id="menuBtn" aria-label="More">⋯<span class="dot" id="dirtydot" hidden></span></button>
  </header>

  <div class="lapbar" id="lapbar">
    <span class="lapno" id="lapno">Lap 1</span>
    <button class="ghost" id="lockbtn" hidden>Unlock</button>
    <button class="ghost" id="backcur" hidden>↩ Current</button>
    <input id="q" type="text" enterkeyhint="done" placeholder="Question for this lap" autocomplete="off" aria-label="Lap question">
    <button class="primary" id="newlap">New lap</button>
  </div>
  <div class="editbanner" id="editbanner" hidden><span class="grow">Editing seating · tap a seat</span><button id="editdone">Done</button></div>

  <div class="stage">
    <div class="board" id="board">Front · Board</div>
    <div id="seats" aria-label="Seats"></div>
  </div>

  <div class="dock">
    <div id="lapdock">
      <div class="tally" id="tally"></div>
      <div class="chips" id="hist" aria-label="Laps" style="margin-top:8px"></div>
    </div>
    <div class="editor" id="editor" hidden>
      <div class="bar">
        <span id="edlabel" class="grow" style="font-weight:700"></span>
        <div class="seg" id="edmode" role="group" aria-label="Change applies">
          <button type="button" data-m="chart" aria-pressed="true">Always</button>
          <button type="button" data-m="today" aria-pressed="false">Today only</button>
        </div>
      </div>
      <div class="bar">
        <button class="ghost" id="edempty" disabled>Empty this seat</button>
        <button class="ghost" id="edundo" hidden>Undo today's change</button>
      </div>
      <div class="pickgrid" id="edpick" aria-label="Students"></div>
    </div>
  </div>
</div>

<div class="scrim" id="menu" hidden>
  <div class="sheet" role="dialog" aria-label="More">
    <button class="item" id="mEdit">Edit seating</button>
    <button class="item" id="mPrint">Print laps</button>
    <button class="item" id="mCopy">Copy CSV <small id="status"></small></button>
    <textarea id="csv" rows="4" readonly hidden aria-label="CSV text"></textarea>
    <button class="item" id="mClear" style="color:var(--not)">Clear laps…</button>
    <div id="confirm" class="bar" hidden style="padding:4px 6px">
      <span class="grow" id="confirmtxt"></span>
      <button class="danger" id="yes">Clear</button><button class="ghost" id="no">Keep</button>
    </div>
    <hr>
    <a class="item btn" href="../home/">Home (this week)</a>
    <a class="item btn" href="../goals/">Student goals</a>
    <a class="item btn" href="../setup/">Classroom setup</a>
    <p class="hint" style="padding:0 6px">Tap a seat to cycle ✓ got it → ~ partial → ✗ not yet. Long-press marks absent.</p>
    <hr>
    <div id="appver-slot" style="padding:0 6px"></div>
  </div>
</div>

<div class="scrim" id="pick" hidden>
  <div class="sheet" role="dialog" aria-label="Class and room" id="picklist"></div>
</div>

<div class="toast" id="toast" hidden></div>

<div id="printout"></div>

<script src="../shared/classroom.js"></script>
<script>
const $=id=>document.getElementById(id);
const CYCLE=['','got','part','not'];
const LOOK={got:['✓','Got it'],part:['~','Partial'],not:['✗','Not yet'],'':['','']};
const WORD={got:'got it',part:'partial',not:'not yet'};
const PK='classroom.prefs';

let D=Classroom.load();
let P={}; try{P=JSON.parse(localStorage.getItem(PK))||{}}catch(e){}
let cls=(P.cls&&D.classes[P.cls])?P.cls:Object.keys(D.classes)[0];
let room=Classroom.roomFor(D,cls,P);
let st, info, cells=[], editing=false, selId=null, view=null, pinnedDay=null, day, filter=null;
// earlier laps and past days are locked; unlocking applies only to what you're looking at now
let unlocked=false;
const isHistory=()=>isPast()||(view!==null&&view<st.laps.length-1);
const locked=()=>isHistory()&&!unlocked;
let toastT; function toast(msg){const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200);}
function blocked(){if(!locked()) return false; toast('This lap is locked. Tap Unlock to change it.'); return true;}
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayOf=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const isPast=()=>day!==today();
const nice=(d,o)=>new Date(d+'T12:00:00').toLocaleDateString(undefined,o||{weekday:'short',month:'short',day:'numeric'});
function esc(t){return String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}

function savePrefs(){P.cls=cls;P['room:'+cls]=room;try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}}
const blankLap=()=>({q:'',t:Date.now(),marks:{}});
// one saved session per class + room + day
const prefix=()=>'lapTracker.v3:'+cls+'|'+room+'|';
const key=()=>prefix()+day;
function migrate(){
  const olds=['lapTracker.v2:'+cls+'|'+room]; if(cls==='601'&&room==='math') olds.push('lapTracker.v1');
  olds.forEach(k=>{try{const s=JSON.parse(localStorage.getItem(k));
    if(s&&s.laps&&s.laps.length){const k3=prefix()+dayOf(s.laps[0].t||Date.now());
      if(!localStorage.getItem(k3)){s.over=s.over||{};localStorage.setItem(k3,JSON.stringify(s));}}
    localStorage.removeItem(k);}catch(e){}});
}
function loadSt(){
  try{const s=JSON.parse(localStorage.getItem(key())); if(s&&s.laps&&s.laps.length){s.over=s.over||{};s.off=s.off||{};return s;}}catch(e){}
  return {laps:[blankLap()],off:{},over:{},dirty:false};
}
const used=l=>l.q||Object.keys(l.marks).length;
function days(){
  const pre=prefix(), out=new Set([today()]);
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))out.add(k.slice(pre.length))}}catch(e){}
  return [...out].sort().reverse();
}
function fillDays(){
  $('day').innerHTML=days().map(d=>{let n=0;
    try{const s=JSON.parse(localStorage.getItem(prefix()+d));n=s?s.laps.filter(used).length:0}catch(e){}
    return `<option value="${d}">${d===today()?'Today':nice(d,{month:'short',day:'numeric'})}${n?' · '+n:''}</option>`}).join('');
  $('day').value=day;
}
function save(){try{localStorage.setItem(key(),JSON.stringify(st))}catch(e){} fillDays();}
const cur=()=>st.laps[view!==null&&view<st.laps.length?view:st.laps.length-1];
// who sits in a seat today: a today-only swap wins over the seating chart (both hold student ids)
const sidOf=seat=>st.over[seat.id]!==undefined?st.over[seat.id]:seat.sid;
const nameOf=seat=>st.over[seat.id]!==undefined?Classroom.nameOf(D,cls,st.over[seat.id]):seat.student;
const isList=()=>info.layout==='list';

function fillPickers(){
  $('where').innerHTML=`<span>${esc(D.classes[cls].name)} <em>· ${esc(D.rooms[room].name)}</em></span><i>▾</i>`;
}
// rooms a class actually uses: its usual room, rooms with a seating chart, rooms with saved laps
function roomsFor(c){
  const out=new Set([Classroom.roomFor(D,c,P)]);
  Object.keys(D.charts).forEach(k=>{const [cc,r]=k.split('|'); if(cc===c&&D.rooms[r]&&Object.keys(D.charts[k]).length) out.add(r);});
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||''; const m=k.match(/^lapTracker\.v3:([^|]*)\|([^|]*)\|/); if(m&&m[1]===c&&D.rooms[m[2]]) out.add(m[2]);}}catch(e){}
  return [...out];
}
function openPicker(all){
  let h='';
  Object.keys(D.classes).forEach(c=>{
    h+=`<div class="cls">${esc(D.classes[c].name)}</div>`;
    (all?Object.keys(D.rooms):roomsFor(c)).forEach(r=>{
      h+=`<button type="button" class="item" data-c="${esc(c)}" data-r="${esc(r)}" aria-current="${c===cls&&r===room}">${esc(D.rooms[r].name)}</button>`;});
  });
  if(!all) h+=`<hr><button type="button" class="item" id="pickall" style="color:var(--accent)">Other rooms…</button>`;
  $('picklist').innerHTML=h; $('pick').hidden=false;
}
function build(){
  D=Classroom.load();
  info=Classroom.seats(D,room,cls);
  day=pinnedDay||today(); migrate(); st=loadSt(); view=null; filter=null; unlocked=false; fillDays();
  cells=Classroom.render($('seats'),info);
  $('board').hidden=isList();
  $('mEdit').hidden=isList();
  if(isList()&&editing) toggleEdit(false);
  $('q').value=cur().q;
  render();
}
function counted(){
  const named=cells.filter(c=>nameOf(c.seat));
  return (named.length?named:cells).filter(c=>!st.off[c.seat.id]);
}
function counts(l){const o={got:0,part:0,not:0};Object.values(l.marks).forEach(v=>{if(o[v]!==undefined)o[v]++});return o}

function render(){
  const l=cur();
  const viewing=view!==null&&view<st.laps.length-1;
  const past=isPast(), lapTxt=viewing?('Lap '+(view+1)+' of '+st.laps.length):'Lap '+st.laps.length;
  const hist=past||viewing, lk=hist&&!unlocked;
  $('lapno').textContent=(hist?(lk?'🔒 ':'✎ '):'')+(past?nice(day,{month:'short',day:'numeric'})+' · ':'')+lapTxt+(hist&&!lk?' · editing':'');
  $('lapno').classList.toggle('past',lk); $('lapno').classList.toggle('editing',hist&&!lk);
  $('lapno').title=lk?'Earlier lap, locked so it is not changed by accident.':hist?'Changes now go into this earlier lap.':'';
  $('lockbtn').hidden=!hist; $('lockbtn').textContent=lk?'Unlock':'Lock'; $('lockbtn').classList.toggle('on',hist&&!lk);
  $('q').readOnly=lk; $('seats').classList.toggle('locked',lk);
  $('mEdit').disabled=lk;
  $('backcur').hidden=!hist; $('backcur').textContent=past?'↩ Today':'↩ Current';
  $('newlap').disabled=past;
  $('confirmtxt').textContent='Clear all laps for '+(past?nice(day):'today')+'?';
  if(document.activeElement!==$('q')) $('q').value=l.q;
  cells.forEach(({seat,el})=>{
    const id=seat.id, s=l.marks[id]||'', off=!!st.off[id], nm=nameOf(seat);
    el.dataset.s=off?'':s; el.dataset.off=off?1:0;
    el.dataset.ov=st.over[id]!==undefined?1:0; el.dataset.empty=nm?0:1;
    el.classList.toggle('sel',editing&&id===selId);
    el.querySelector('.name').textContent=nm||(isList()?'':'—');
    el.querySelector('.mark').textContent=off?'—':LOOK[s][0];
    el.querySelector('.word').textContent=off?'Absent':LOOK[s][1];
    el.setAttribute('aria-label',(seat.label?seat.label+' ':'')+(nm||'empty seat')+': '+(off?'absent':(LOOK[s][1]||'not checked')));
  });
  $('seats').classList.toggle('editing',editing);
  const c=counts(l), unchecked=counted().filter(x=>!l.marks[x.seat.id]).length;
  const tb=(f,cl,lab,n)=>`<button type="button" class="${cl}" data-f="${f}" aria-pressed="${filter===f}">${lab} <b>${n}</b></button>`;
  $('tally').innerHTML=tb('got','g','✓',c.got)+tb('part','p','~',c.part)+tb('not','x','✗',c.not)+tb('none','','<em>Unchecked</em>',unchecked);
  // highlight only the seats behind the tapped counter
  const pool=new Set(counted().map(x=>x.seat.id));
  $('seats').classList.toggle('filtering',!!filter&&!editing);
  cells.forEach(({seat,el})=>{const m=l.marks[seat.id];
    const match=filter==='none'?(pool.has(seat.id)&&!m):(!st.off[seat.id]&&m===filter);
    el.classList.toggle('dim',!!filter&&!match);});
  const on=view!==null?view:st.laps.length-1;
  $('hist').innerHTML=st.laps.map((l,i)=>{const c=counts(l);
    return `<button type="button" class="chip${on===i?' on':''}" data-i="${i}"><span class="t1">Lap ${i+1}${i===st.laps.length-1?' <i>Now</i>':''}<span style="margin-left:auto;color:var(--got)">✓${c.got}</span></span>`+
      `<span class="t2">${l.q?esc(l.q):'No question'}</span></button>`}).join('');
  const chip=$('hist').querySelector('.chip.on'); if(chip) chip.scrollIntoView({inline:'nearest',block:'nearest'});
  $('dirtydot').hidden=!st.dirty;
  $('status').textContent=st.dirty?'Not copied yet':(st.laps.some(used)?'Copied':'');
}

// tapping seats
let pressT=null, longFired=false;
const seatsEl=$('seats');
seatsEl.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.seat'); if(!b||editing||locked()) return; longFired=false;
  pressT=setTimeout(()=>{longFired=true;const id=b.dataset.id;
    st.off[id]=!st.off[id]; if(st.off[id]) delete cur().marks[id];
    st.dirty=true; save(); render();},600);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>seatsEl.addEventListener(ev,()=>clearTimeout(pressT)));
seatsEl.addEventListener('contextmenu',e=>e.preventDefault());
seatsEl.addEventListener('click',e=>{
  const b=e.target.closest('.seat'); if(!b||longFired) return;
  const id=b.dataset.id;
  if(editing){selId=id; renderEditor(); render(); return;}
  if(blocked()) return;
  if(st.off[id]) return;
  const m=cur().marks; const next=CYCLE[(CYCLE.indexOf(m[id]||'')+1)%CYCLE.length];
  if(next) m[id]=next; else delete m[id];
  st.dirty=true; save(); render();
});

$('where').addEventListener('click',()=>openPicker(false));
$('pick').addEventListener('click',e=>{
  if(e.target===$('pick')){$('pick').hidden=true;return;}
  if(e.target.closest('#pickall')){openPicker(true);return;}
  const b=e.target.closest('button[data-c]'); if(!b) return;
  $('pick').hidden=true;
  if(b.dataset.c===cls&&b.dataset.r===room) return;
  cls=b.dataset.c; room=b.dataset.r; pinnedDay=null; savePrefs(); fillPickers(); build();});
$('day').addEventListener('change',e=>{pinnedDay=e.target.value===today()?null:e.target.value; build();});

// keyboard: Done closes it, and so does a tap anywhere outside a text box
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur();}});
document.addEventListener('pointerdown',e=>{const a=document.activeElement;
  if(a&&a.tagName==='INPUT'&&!e.target.closest('input,select,textarea,datalist')) a.blur();},true);
$('q').addEventListener('input',()=>{if(locked()) return; cur().q=$('q').value; st.dirty=true; save(); render();});
$('q').addEventListener('focus',()=>{if(locked()){$('q').blur(); toast('This lap is locked. Tap Unlock to change it.');}});
$('lockbtn').addEventListener('click',()=>{unlocked=!unlocked; render(); if(unlocked) toast('Unlocked. Changes now go into this earlier lap.');});
$('newlap').addEventListener('click',()=>{view=null; unlocked=false; st.laps.push(blankLap()); st.dirty=true; save(); $('q').value=''; render(); $('q').focus();});

$('tally').addEventListener('click',e=>{const b=e.target.closest('button[data-f]'); if(!b) return;
  filter=filter===b.dataset.f?null:b.dataset.f; render();});

// recall a lap
$('hist').addEventListener('click',e=>{const r=e.target.closest('.chip'); if(!r) return;
  const i=+r.dataset.i, nv=(i===st.laps.length-1)?null:i; if(nv!==view) unlocked=false; view=nv; $('q').value=cur().q; render();});
$('backcur').addEventListener('click',()=>{if(isPast()){pinnedDay=null;build();}else{view=null;unlocked=false;$('q').value=cur().q;render();}});

// menu
const menu=$('menu');
const closeMenu=()=>{menu.hidden=true;$('confirm').hidden=true;$('csv').hidden=true;};
$('menuBtn').addEventListener('click',()=>{menu.hidden=false;});
menu.addEventListener('click',e=>{if(e.target===menu)closeMenu();});

// printable summary: students down the side, laps across the top
$('mPrint').addEventListener('click',()=>{
  closeMenu();
  const anyNamed=cells.some(c=>nameOf(c.seat));
  const rows=anyNamed?cells.filter(c=>nameOf(c.seat)):cells;
  const sym={got:'✓',part:'~',not:'✗'};
  const when=nice(day,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  let h=`<h1>${esc(D.classes[cls].name)} · ${esc(D.rooms[room].name)} · ${esc(when)}</h1><table><thead><tr><th class="l">Seat</th><th class="l">Student</th>`;
  st.laps.forEach((l,i)=>h+=`<th>Lap ${i+1}<small>${esc(l.q||'')}</small></th>`);
  h+='<th>✓ total</th></tr></thead><tbody>';
  rows.forEach(({seat})=>{
    const off=!!st.off[seat.id]; let got=0;
    h+=`<tr><td class="l">${esc(seat.label||'')}</td><td class="l">${esc(nameOf(seat)||'')}</td>`;
    st.laps.forEach(l=>{const m=l.marks[seat.id]; if(m==='got')got++; h+=`<td>${off?'abs':(sym[m]||'')}</td>`});
    h+=`<td>${off?'':got}</td></tr>`;
  });
  h+='</tbody><tfoot><tr><td class="l" colspan="2">✓ / ~ / ✗</td>';
  st.laps.forEach(l=>{const c=counts(l); h+=`<td>${c.got} / ${c.part} / ${c.not}</td>`});
  h+='<td></td></tr></tfoot></table>';
  $('printout').innerHTML=h;
  setTimeout(()=>window.print(),50);
});

// seating edits: tap a seat, then tap a student. No typing.
const seatById=id=>(cells.find(c=>c.seat.id===id)||{}).seat;
let edMode='chart';
function renderEditor(){
  const seat=selId&&seatById(selId), who=seat?nameOf(seat):'';
  $('edlabel').textContent=seat?('Seat '+seat.label+(who?' · '+who:' · empty')):'Tap a seat';
  $('edempty').disabled=!who;
  $('edundo').hidden=!(seat&&st.over[selId]!==undefined);
  document.querySelectorAll('#edmode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===edMode));
  const roster=(D.classes[cls]||{}).students||[];
  const where={}; cells.forEach(({seat})=>{const id=sidOf(seat); if(id) where[id]=seat;});
  const btn=s=>{const w=where[s.id]; const here=w&&w.id===selId;
    return `<button type="button" data-n="${esc(s.id)}" class="${here?'here':w?'seated':''}" ${seat?'':'disabled'}>${esc(s.name)}${w&&!here?' <small>'+esc(w.label)+'</small>':''}</button>`;};
  const free=roster.filter(s=>!where[s.id]), taken=roster.filter(s=>where[s.id]);
  $('edpick').innerHTML=(roster.length?'':'<span class="hint">Add students to this class in Setup first.</span>')
    +(free.length?'<h4>Not seated</h4>'+free.map(btn).join(''):'')
    +(taken.length?'<h4>Seated · tap to move here</h4>'+taken.map(btn).join(''):'');
  if(renderEditor.last!==selId){$('edpick').scrollTop=0; renderEditor.last=selId;}
}
function rebuildSeats(){const v0=view, keep=selId; D=Classroom.load(); info=Classroom.seats(D,room,cls); cells=Classroom.render($('seats'),info); view=v0; selId=keep;}
function afterEdit(advance){
  st.dirty=true; save(); rebuildSeats();
  if(advance){const next=cells.find(c=>!nameOf(c.seat)); if(next) selId=next.seat.id;}
  renderEditor(); render();
}
function toggleEdit(on){
  editing=on; selId=null;
  $('editor').hidden=!on; $('lapdock').hidden=on; $('editbanner').hidden=!on; $('lapbar').hidden=on;
  renderEditor(); render();
}
$('mEdit').addEventListener('click',()=>{closeMenu();toggleEdit(true);});
$('editdone').addEventListener('click',()=>toggleEdit(false));
$('edmode').addEventListener('click',e=>{const b=e.target.closest('button[data-m]'); if(b){edMode=b.dataset.m; renderEditor();}});
$('edpick').addEventListener('click',e=>{
  const b=e.target.closest('button[data-n]'); if(!b||!selId) return;
  const n=b.dataset.n, wasEmpty=!nameOf(seatById(selId));
  const from=cells.find(c=>sidOf(c.seat)===n&&c.seat.id!==selId);
  if(edMode==='chart'){
    const d=Classroom.load(), k=cls+'|'+room, ch=d.charts[k]=d.charts[k]||{};
    Object.keys(ch).forEach(id=>{if(ch[id]===n) delete ch[id];});
    ch[selId]=n; Classroom.save(d);
    delete st.over[selId]; if(from) delete st.over[from.seat.id];
  } else {
    if(from) st.over[from.seat.id]='';
    st.over[selId]=n;
  }
  afterEdit(wasEmpty);
});
$('edempty').addEventListener('click',()=>{
  if(!selId) return;
  if(edMode==='chart'){const d=Classroom.load(), k=cls+'|'+room; if(d.charts[k]) delete d.charts[k][selId]; Classroom.save(d); delete st.over[selId];}
  else st.over[selId]='';
  afterEdit(false);
});
$('edundo').addEventListener('click',()=>{if(!selId) return; delete st.over[selId]; afterEdit(false);});

// export
function toCSV(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=['date,class,room,lap,question,seat,student,status'];
  const anyNamed=cells.some(c=>nameOf(c.seat));
  const rows=anyNamed?cells.filter(c=>nameOf(c.seat)):cells;
  st.laps.forEach((l,i)=>rows.forEach(({seat})=>{
    const v=st.off[seat.id]?'absent':(WORD[l.marks[seat.id]]||'unchecked');
    lines.push([day,q(D.classes[cls].name),q(D.rooms[room].name),i+1,q(l.q),q(seat.label||''),q(nameOf(seat)),v].join(','));
  }));
  return lines.join('\n');
}
$('mCopy').addEventListener('click',()=>{
  const t=$('csv'); t.value=toCSV();
  const ok=()=>{st.dirty=false;save();render();t.hidden=true;$('status').textContent='Copied to clipboard';};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok).catch(()=>{t.hidden=false;t.select();});
  else {t.hidden=false;t.select();}
});
$('mClear').addEventListener('click',()=>{if(isPast()&&!unlocked){closeMenu();toast('This day is locked. Tap Unlock first to clear it.');return;} $('confirm').hidden=false});
$('no').addEventListener('click',()=>{$('confirm').hidden=true});
$('yes').addEventListener('click',()=>{try{localStorage.removeItem(key())}catch(e){} closeMenu(); build();});

// refresh if Setup changed things
addEventListener('storage',e=>{if(e.key==='classroom.v1'){D=Classroom.load();fillPickers();build();}});
addEventListener('pageshow',()=>{D=Classroom.load();fillPickers();build();});
// roll over to a new day if the app was left open overnight
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!pinnedDay&&day!==today())build();});

async function wake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',wake); wake();

fillPickers(); savePrefs(); build();
</script>
