<body><p>Student goals now live in <a href="../home/">Classroom Home</a> (Students and Goal bank tabs). You can remove this app's icon.</p>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(r.scope.endsWith('/goals/')) r.unregister();}));location.replace('../home/');</script>
</body></html>
