<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a5f9e">
<title>Student Goals</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="../shared/classroom.css">
<style>
/* Layout: sticky header (class, tabs), scrolling list below; editors and logging open as bottom sheets */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
main{gap:10px;padding-top:0}
#clsBtn{min-height:44px;justify-content:flex-start;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font:700 17px var(--sans);flex:1;min-width:0}
#clsBtn i{font-style:normal;margin-left:auto;color:var(--muted);font-size:14px}
.iconbtn{min-height:44px;min-width:44px;padding:0;font-size:22px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.tabs{display:flex}
.tabs button{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}
.meta{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.tag.over{border-color:var(--not);color:var(--not)}
.tag.due{border-color:var(--part);color:var(--part)}
.tag.ok{border-color:var(--got);color:var(--got)}
.rowbtn{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--fg);text-align:left;font:500 16px var(--sans);justify-content:flex-start}
.rowbtn .grow{min-width:0}
.rowbtn b{font-weight:700}
.res{display:flex;gap:4px;flex-wrap:wrap}
.res span{font:600 12px var(--mono);border-radius:6px;padding:2px 6px;background:var(--sunk)}
.res .y{color:var(--got)}.res .n{color:var(--not)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.crit{font-size:15px;white-space:pre-wrap;color:var(--fg);background:var(--sunk);border-radius:10px;padding:8px 10px}
.sheet h2{margin:2px 6px 4px}
.sheet .field{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.sheet .field label,.lbl{font-size:13px;color:var(--muted);font-weight:600}
.sheet textarea{min-height:90px;font:16px var(--sans);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:42px;padding:0 12px;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font-weight:500}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
.chips .grp{border-style:dashed;color:var(--accent)}
.logrow{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px}
.logrow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logrow .nm{font-weight:700;flex:1;min-width:120px}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-height:44px;min-width:44px;padding:0;font-size:22px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.step output{font:700 22px var(--mono);min-width:2ch;text-align:center}
.pct{font:600 14px var(--mono);color:var(--muted);min-width:4ch;text-align:right}
.yn{display:inline-flex;gap:6px}
.yn button{min-height:44px;padding:0 14px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.yn button[aria-pressed="true"][data-v="1"]{background:var(--got);border-color:var(--got);color:var(--onaccent)}
.yn button[aria-pressed="true"][data-v="0"]{background:var(--not);border-color:var(--not);color:var(--onaccent)}
.yn button[aria-pressed="true"][data-v="s"]{background:var(--sunk);border-color:var(--muted)}
.logrow input[type=text]{width:100%}
.hist{display:flex;flex-direction:column}
.hist .h{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 2px;font-size:15px}
.hist .h:first-child{border-top:0}
.hist .d{font:600 13px var(--mono);color:var(--muted);width:7ch}
.hist .r{font:700 15px var(--mono);width:9ch}
.hist .t{flex:1;min-width:0;color:var(--fg)}
.hist .x{min-height:36px;padding:0 10px;background:none;border:0;color:var(--muted);font-size:14px}
.hist .x.sure{background:var(--not);color:var(--onaccent)}
.sumlist{display:flex;flex-direction:column;gap:6px;padding:0 6px}
.note{border-radius:12px;padding:10px 12px;background:var(--sunk);font-size:15px}
.note.bad{border:1.5px solid var(--not);background:transparent;color:var(--not);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 15px var(--sans)}
.sticky-actions{position:sticky;bottom:0;background:var(--card);padding:10px 6px 2px;display:flex;gap:10px}
.sticky-actions button{flex:1}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="bar">
      <button type="button" id="clsBtn" aria-label="Class"></button>
      <button type="button" class="iconbtn" id="menuBtn" aria-label="More">⋯</button>
    </div>
    <div class="seg tabs" id="tabs">
      <button type="button" data-t="due" aria-pressed="true">Due</button>
      <button type="button" data-t="students" aria-pressed="false">Students</button>
      <button type="button" data-t="goals" aria-pressed="false">Goals</button>
      <button type="button" data-t="groups" aria-pressed="false">Groups</button>
    </div>
  </div>
  <div id="view" class="list"></div>
</main>

<div class="scrim" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="../shared/classroom.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseDay=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parseDay(s);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
const short=s=>parseDay(s).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastT; const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);};

// ---------- data: goals, student groups and logs live on this tablet only
const GK='goals.v1', PK='goals.prefs';
const CADENCE=[['daily','Every school day',1],['twice','Twice a week',3],['weekly','Weekly',7],['biweekly','Every 2 weeks',14],['monthly','Monthly',28]];
const cadDays=c=>(CADENCE.find(x=>x[0]===c)||CADENCE[2])[2];
const cadName=c=>(CADENCE.find(x=>x[0]===c)||CADENCE[2])[1];
const KIND={trials:'Trials',yesno:'Yes / no',note:'Notes only'};
function loadG(){let g=null;try{g=JSON.parse(localStorage.getItem(GK))}catch(e){}
  g=g&&typeof g==='object'?g:{}; g.goals=g.goals||{}; g.groups=g.groups||{}; g.logs=Array.isArray(g.logs)?g.logs:[]; return g;}
let G=loadG();
const saveG=()=>{try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){toast("Couldn't save. The tablet may be out of space.");}};
let D=Classroom.load();
let P={}; try{P=JSON.parse(localStorage.getItem(PK))||{}}catch(e){}
let cls=(P.cls&&D.classes[P.cls])?P.cls:Object.keys(D.classes)[0];
let tab='due', showArchived=false;
const savePrefs=()=>{P.cls=cls;try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
const roster=()=>(D.classes[cls]||{}).students||[];
const sname=sid=>Classroom.nameOf(D,cls,sid)||'(removed student)';
const classGoals=()=>Object.values(G.goals).filter(g=>g.cls===cls);
const activeGoals=()=>classGoals().filter(g=>!g.archived);
const logsFor=(gid,sid)=>G.logs.filter(l=>l.goal===gid&&l.sid===sid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.t-b.t);

// each student on a goal can have their own frequency, trials, dates and status; blanks fall back to the goal
const per=(g,sid)=>(g.per&&g.per[sid])||{};
function eff(g,sid){const o=per(g,sid);
  return {cadence:o.cadence||g.cadence, defTotal:o.defTotal||g.defTotal||5, start:o.start||g.start||'', end:o.end||g.end||'',
    status:o.status||'active', metDate:o.metDate||'', custom:!!(o.cadence||o.defTotal||o.start||o.end)};}
// next check: last log + frequency, moved off weekends; first check is the start date
function nextDue(g,sid){
  const e=eff(g,sid), ls=logsFor(g.id,sid), last=ls.length?ls[ls.length-1].date:null;
  let d=last?addDays(last,cadDays(e.cadence)):(e.start||today());
  const wd=parseDay(d).getDay(); if(wd===6) d=addDays(d,2); else if(wd===0) d=addDays(d,1);
  return {date:d,last};
}
function status(g,sid){
  const e=eff(g,sid);
  if(e.status==='met') return {cls:'ok',txt:'Met'+(e.metDate?' '+short(e.metDate):''),due:false,done:true};
  if(e.status==='paused') return {cls:'',txt:'Paused',due:false,done:true};
  if(e.end&&today()>e.end) return {cls:'',txt:'Ended '+short(e.end),due:false};
  if(e.start&&today()<e.start) return {cls:'',txt:'Starts '+short(e.start),due:false};
  const n=nextDue(g,sid), diff=daysBetween(n.date,today());
  if(!n.last) return {cls:'due',txt:'Not logged yet',due:true,od:diff};
  if(diff>0) return {cls:'over',txt:diff+' day'+(diff>1?'s':'')+' overdue',due:true,od:diff};
  if(diff===0) return {cls:'due',txt:'Due today',due:true,od:0};
  return {cls:'ok',txt:'Next '+short(n.date),due:false};
}
// attempts so far: "14 checks since Sep 30"
function attempts(g,sid){const ls=logsFor(g.id,sid); if(!ls.length) return '';
  const n=g.kind==='trials'?ls.filter(l=>l.kind==='trials').reduce((a,l)=>a+l.total,0):0;
  return ls.length+' check'+(ls.length===1?'':'s')+(n?' ('+n+' trials)':'')+' since '+short(ls[0].date);}
// where a check happened
const WHERE_FIXED=['Small group','Pull-out','1:1'];
const whereOptions=()=>[...Object.values(D.rooms).map(r=>r.name),...WHERE_FIXED];
function resText(l){
  if(l.kind==='trials') return l.correct+'/'+l.total;
  if(l.kind==='yesno') return l.yes===true?'✓':l.yes===false?'✗':'·';
  return '✎';
}
function recentChips(g,sid,n){
  const ls=logsFor(g.id,sid).slice(-(n||5));
  if(!ls.length) return '';
  return '<div class="res">'+ls.map(l=>`<span class="${l.kind==='yesno'?(l.yes===true?'y':l.yes===false?'n':''):''}" title="${esc(short(l.date))}">${esc(resText(l))}</span>`).join('')+'</div>';
}
function recentPct(g,sid){
  if(g.kind!=='trials') return '';
  const ls=logsFor(g.id,sid).filter(l=>l.kind==='trials'&&l.total>0).slice(-5);
  if(!ls.length) return '';
  const c=ls.reduce((a,l)=>a+l.correct,0), t=ls.reduce((a,l)=>a+l.total,0);
  return Math.round(100*c/t)+'% over last '+ls.length;
}

// ---------- header
function renderHead(){
  $('clsBtn').innerHTML=`<span>${esc((D.classes[cls]||{}).name||'No class')}</span><i>▾</i>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tab));
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;tab=b.dataset.t;render();window.scrollTo(0,0);});
$('clsBtn').addEventListener('click',()=>{
  openSheet(`<h2>Class</h2>`+Object.keys(D.classes).map(c=>`<button type="button" class="item" data-c="${esc(c)}" aria-current="${c===cls}">${esc(D.classes[c].name)}</button>`).join(''),
    el=>el.addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(!b)return;cls=b.dataset.c;savePrefs();closeSheet();render();}));
});

// ---------- sheets
function openSheet(html,wire){$('sheet').innerHTML=html;$('sheetWrap').hidden=false;$('sheet').scrollTop=0;if(wire)wire($('sheet'));}
function closeSheet(){$('sheetWrap').hidden=true;$('sheet').innerHTML='';}
$('sheetWrap').addEventListener('click',e=>{if(e.target===$('sheetWrap'))closeSheet();});
document.addEventListener('pointerdown',e=>{const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!e.target.closest('input,select,textarea,button,label')) a.blur();},true);

// ---------- views
function render(){
  D=Classroom.load(); if(!D.classes[cls]) cls=Object.keys(D.classes)[0];
  renderHead();
  ({due:renderDue,students:renderStudents,goals:renderGoals,groups:renderGroups})[tab]();
}

function renderDue(){
  const items=[];
  activeGoals().forEach(g=>{const due=g.students.map(sid=>({sid,st:status(g,sid)})).filter(x=>x.st.due);
    if(due.length) items.push({g,due,od:Math.max(...due.map(x=>x.st.od||0))});});
  items.sort((a,b)=>b.od-a.od);
  if(!activeGoals().length){$('view').innerHTML=`<div class="empty">No goals for this class yet.<br><br><button class="primary" id="goNew">+ New goal</button></div>`;
    $('goNew').addEventListener('click',()=>editGoal(null));return;}
  if(!items.length){$('view').innerHTML=`<div class="empty">Nothing due today. 🎉<br>Check the Students tab for upcoming checks.</div>`;return;}
  const nDue=items.reduce((a,i)=>a+i.due.length,0);
  $('view').innerHTML=`<div class="meta">${nDue} check${nDue===1?'':'s'} due</div>`+items.map(({g,due})=>`
    <div class="card"><div class="bar"><h3 class="grow">${esc(g.title)}</h3><span class="tag">${esc(KIND[g.kind])}</span></div>
      ${due.map(({sid,st})=>`<button type="button" class="rowbtn" data-g="${esc(g.id)}" data-s="${esc(sid)}"><span class="grow"><b>${esc(sname(sid))}</b></span>${recentChips(g,sid,3)}<span class="tag ${st.cls}">${esc(st.txt)}</span></button>`).join('')}
      ${due.length>1?`<button type="button" class="ghost" data-all="${esc(g.id)}">Log all ${due.length}</button>`:''}
    </div>`).join('');
  $('view').onclick=e=>{const b=e.target.closest('[data-g],[data-all]');if(!b)return;
    if(b.dataset.all){const g=G.goals[b.dataset.all];logSheet(g,g.students.filter(s=>status(g,s).due));}
    else logSheet(G.goals[b.dataset.g],[b.dataset.s]);};
}

function renderStudents(){
  const r=roster(); if(!r.length){$('view').innerHTML=`<div class="empty">This class has no students. Add them in Classroom setup.</div>`;return;}
  $('view').innerHTML=r.map(s=>{const gs=activeGoals().filter(g=>g.students.includes(s.id));
    const due=gs.filter(g=>status(g,s.id).due).length, met=gs.filter(g=>eff(g,s.id).status==='met').length;
    return `<button type="button" class="rowbtn" data-s="${esc(s.id)}"><span class="grow"><b>${esc(s.name)}</b></span><span class="meta">${gs.length} goal${gs.length===1?'':'s'}${met?' · '+met+' met':''}</span>${due?`<span class="tag due">${due} due</span>`:''}</button>`;}).join('');
  $('view').onclick=e=>{const b=e.target.closest('[data-s]');if(b)studentView(b.dataset.s);};
}

function studentView(sid){
  const gs=activeGoals().filter(g=>g.students.includes(sid)), others=activeGoals().filter(g=>!g.students.includes(sid));
  const nm=esc(sname(sid));
  const addExisting=others.length?`<div class="card"><h3>Add ${nm} to an existing goal</h3>
      ${others.map(g=>`<button type="button" class="rowbtn" data-join="${esc(g.id)}"><span class="grow"><b>${esc(g.title)}</b><br><span class="meta">${esc(KIND[g.kind])} · ${esc(cadName(g.cadence))} · ${g.students.length} student${g.students.length===1?'':'s'}</span></span><span class="tag">+ Add</span></button>`).join('')}</div>`:'';
  $('view').innerHTML=`<div class="bar"><button class="plain" id="backS" style="padding:0">‹ Students</button></div>
    <div class="bar"><h2 class="grow">${nm}</h2>${gs.length?'<button class="primary" id="newFor">+ New goal</button>':''}</div>`+
    (gs.length?gs.slice().sort((a,b)=>(status(a,sid).done?1:0)-(status(b,sid).done?1:0)).map(g=>{const st=status(g,sid),pc=recentPct(g,sid),e=eff(g,sid),at=attempts(g,sid);
      return `<div class="card"><div class="bar"><h3 class="grow">${esc(g.title)}</h3><span class="tag ${st.cls}">${esc(st.txt)}</span></div>
        ${g.criteria?`<div class="crit">${esc(g.criteria)}</div>`:''}
        <div class="meta"><span>${esc(KIND[g.kind])}</span>·<span>${esc(cadName(e.cadence))}${g.kind==='trials'?', '+e.defTotal+' trials':''}${e.custom?' <b style="color:var(--accent)">(just for '+nm+')</b>':''}</span>${g.students.length>1?'·<span>Shared</span>':''}</div>
        ${(at||pc)?`<div class="meta">${at?'<span>'+esc(at)+'</span>':''}${at&&pc?'·':''}${pc?'<span>'+esc(pc)+'</span>':''}</div>`:''}
        ${recentChips(g,sid,10)}
        <div class="bar">${st.done?'':`<button class="primary" data-log="${esc(g.id)}">Log</button>`}<button class="ghost" data-hist="${esc(g.id)}">History</button><button class="ghost" data-per="${esc(g.id)}">${st.done?'Reopen…':'Settings & status'}</button><span class="grow"></span><button class="plain" data-edit="${esc(g.id)}">Edit goal</button></div></div>`;}).join('')+(others.length?`<details class="card"><summary style="font-weight:700;cursor:pointer">Add ${nm} to another goal (${others.length})</summary>${addExisting.replace(/^<div class="card"><h3>[^<]*<\/h3>/,'').replace(/<\/div>$/,'')}</details>`:'')
      :`<div class="card" style="align-items:center;text-align:center;padding:24px 14px">
          <h3>No goals for ${nm} yet</h3>
          <button class="primary" id="newFor2">+ New goal for ${nm}</button>
        </div>`+addExisting);
  const fresh=()=>studentView(sid);
  $('backS').addEventListener('click',renderStudents);
  if($('newFor')) $('newFor').addEventListener('click',()=>editGoal(null,[sid],fresh));
  if($('newFor2')) $('newFor2').addEventListener('click',()=>editGoal(null,[sid],fresh));
  $('view').onclick=e=>{const l=e.target.closest('[data-log]'),h=e.target.closest('[data-hist]'),j=e.target.closest('[data-join]'),ed=e.target.closest('[data-edit]'),pr=e.target.closest('[data-per]');
    if(pr) perSheet(G.goals[pr.dataset.per],sid,fresh);
    if(l) logSheet(G.goals[l.dataset.log],[sid],fresh);
    if(h) historySheet(G.goals[h.dataset.hist],sid,fresh);
    if(ed) editGoal(G.goals[ed.dataset.edit],null,fresh);
    if(j){G=loadG(); const g=G.goals[j.dataset.join]; if(g&&!g.students.includes(sid)){g.students.push(sid); g.updated=Date.now(); saveG(); toast('Added to '+g.title);} fresh();}};
}

function renderGoals(){
  const gs=classGoals().filter(g=>showArchived?g.archived:!g.archived).sort((a,b)=>a.title.localeCompare(b.title));
  const nArch=classGoals().filter(g=>g.archived).length;
  $('view').innerHTML=`<div class="bar"><button class="primary" id="newGoal">+ New goal</button><span class="grow"></span>${nArch||showArchived?`<button class="plain" id="arch">${showArchived?'Show active':'Archived ('+nArch+')'}</button>`:''}</div>`+
    (gs.length?gs.map(g=>{const due=g.students.filter(s=>status(g,s).due).length, met=g.students.filter(s=>eff(g,s).status==='met').length;
      return `<button type="button" class="rowbtn" data-g="${esc(g.id)}" style="flex-direction:column;align-items:stretch;gap:4px;padding:10px 12px">
        <span class="bar"><b class="grow">${esc(g.title)}</b>${due&&!g.archived?`<span class="tag due">${due} due</span>`:''}</span>
        <span class="meta"><span>${esc(KIND[g.kind])}</span>·<span>${esc(cadName(g.cadence))}</span>·<span>${g.students.map(s=>esc(sname(s))+(eff(g,s).status==='met'?' ✓':eff(g,s).status==='paused'?' (paused)':'')).join(', ')||'No students'}</span>${met?'·<span>'+met+' of '+g.students.length+' met</span>':''}</span></button>`;}).join('')
      :`<div class="empty">${showArchived?'No archived goals.':'No goals yet.'}</div>`);
  $('newGoal').addEventListener('click',()=>editGoal(null));
  if($('arch')) $('arch').addEventListener('click',()=>{showArchived=!showArchived;renderGoals();});
  $('view').onclick=e=>{const b=e.target.closest('[data-g]');if(b)editGoal(G.goals[b.dataset.g]);};
}

function renderGroups(){
  const gs=Object.values(G.groups).filter(g=>g.cls===cls).sort((a,b)=>a.name.localeCompare(b.name));
  $('view').innerHTML=`<div class="bar"><button class="primary" id="newGrp">+ New group</button></div>
    <p class="hint">Groups are shortcuts for picking students when you set up or log a goal.</p>`+
    (gs.length?gs.map(g=>`<button type="button" class="rowbtn" data-gr="${esc(g.id)}"><span class="grow"><b>${esc(g.name)}</b><br><span class="meta">${g.students.map(s=>esc(sname(s))).join(', ')||'No students'}</span></span></button>`).join('')
      :`<div class="empty">No groups yet.</div>`);
  $('newGrp').addEventListener('click',()=>editGroup(null));
  $('view').onclick=e=>{const b=e.target.closest('[data-gr]');if(b)editGroup(G.groups[b.dataset.gr]);};
}

// ---------- student picker used by goal and group editors
function pickerHTML(selected,withGroups){
  const grps=withGroups?Object.values(G.groups).filter(g=>g.cls===cls):[];
  return `<div class="chips" id="pickStu">${grps.map(g=>`<button type="button" class="grp" data-grp="${esc(g.id)}">+ ${esc(g.name)}</button>`).join('')}
    ${roster().map(s=>`<button type="button" data-sid="${esc(s.id)}" aria-pressed="${selected.includes(s.id)}">${esc(s.name)}</button>`).join('')}</div>
    ${roster().length?'':'<p class="hint">Add students in Classroom setup first.</p>'}`;
}
function wirePicker(el,sel){
  el.querySelector('#pickStu').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.grp){G.groups[b.dataset.grp].students.forEach(s=>{if(roster().some(r=>r.id===s)&&!sel.includes(s))sel.push(s);});
      el.querySelectorAll('#pickStu [data-sid]').forEach(x=>x.setAttribute('aria-pressed',sel.includes(x.dataset.sid)));return;}
    const i=sel.indexOf(b.dataset.sid); if(i<0)sel.push(b.dataset.sid); else sel.splice(i,1);
    b.setAttribute('aria-pressed',i<0);
  });
}

// ---------- goal editor
function editGoal(g,preSids,after){
  const isNew=!g; const d=g?JSON.parse(JSON.stringify(g)):{id:uid('g'),cls,title:'',criteria:'',kind:'trials',defTotal:5,cadence:'weekly',start:today(),end:'',students:(preSids||[]).slice(),archived:false};
  const sel=d.students.slice(); const nlogs=g?G.logs.filter(l=>l.goal===g.id).length:0;
  openSheet(`<h2>${isNew?'New goal':'Edit goal'}</h2>
    <div class="field"><label for="gTitle">Goal</label><input id="gTitle" type="text" value="${esc(d.title)}" placeholder="Short name for the goal" enterkeyhint="next"></div>
    <div class="field"><label for="gCrit">Criteria</label><textarea id="gCrit" placeholder="How you'll know it's met">${esc(d.criteria)}</textarea></div>
    <div class="field"><span class="lbl">Log as</span><div class="seg" id="gKind">${Object.keys(KIND).map(k=>`<button type="button" data-k="${k}" aria-pressed="${d.kind===k}">${KIND[k]}</button>`).join('')}</div></div>
    <div class="field" id="gTotWrap"><label for="gTot">Usual number of trials <span style="font-weight:400">(each student can differ)</span></label><input id="gTot" type="number" min="1" max="50" value="${d.defTotal||5}" style="width:100px"></div>
    <div class="field"><label for="gCad">Check <span style="font-weight:400">(each student can differ)</span></label><select id="gCad">${CADENCE.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Dates</span><div class="bar"><input id="gStart" type="date" value="${esc(d.start||'')}" aria-label="Start date"><span class="hint">to</span><input id="gEnd" type="date" value="${esc(d.end||'')}" aria-label="End date (optional)"></div></div>
    <div class="field"><span class="lbl">Students${Object.values(G.groups).some(x=>x.cls===cls)?' · dashed buttons add a whole group':''}</span>${pickerHTML(sel,true)}</div>
    <div id="gErr" class="note bad" hidden style="margin:0 6px"></div>
    ${isNew?'':`<div class="bar" style="padding:6px"><button class="ghost" id="gArch">${d.archived?'Restore goal':'Archive goal'}</button><button class="plain" id="gDel" style="color:var(--not)">Delete…</button></div>
      <div class="note" id="gDelC" hidden style="margin:0 6px">Delete this goal and its ${nlogs} log entr${nlogs===1?'y':'ies'}? Archive keeps the history instead.<div class="bar" style="margin-top:8px"><button class="danger" id="gDelY">Delete</button><button class="ghost" id="gDelN">Keep</button></div></div>`}
    <div class="sticky-actions"><button class="ghost" id="gCancel">Cancel</button><button class="primary" id="gSave">${isNew?'Add goal':'Save'}</button></div>`,
  el=>{
    el.querySelector('#gCad').value=d.cadence;
    const kindUI=()=>{el.querySelectorAll('#gKind button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===d.kind));el.querySelector('#gTotWrap').hidden=d.kind!=='trials';};
    kindUI(); el.querySelector('#gKind').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){d.kind=b.dataset.k;kindUI();}});
    wirePicker(el,sel);
    el.querySelector('#gCancel').addEventListener('click',closeSheet);
    el.querySelector('#gSave').addEventListener('click',()=>{
      const err=m=>{const x=el.querySelector('#gErr');x.textContent=m;x.hidden=false;};
      d.title=el.querySelector('#gTitle').value.trim(); d.criteria=el.querySelector('#gCrit').value.trim();
      d.cadence=el.querySelector('#gCad').value; d.start=el.querySelector('#gStart').value||today(); d.end=el.querySelector('#gEnd').value||'';
      d.defTotal=Math.max(1,Math.min(50,+el.querySelector('#gTot').value||5)); d.students=sel.slice(); d.updated=Date.now();
      if(!d.title) return err('Give the goal a short name.');
      if(!d.students.length) return err('Pick at least one student.');
      if(d.end&&d.end<d.start) return err('The end date is before the start date.');
      G=loadG(); G.goals[d.id]=d; saveG(); closeSheet(); toast(isNew?'Goal added':'Saved'); (after||render)();
    });
    if(!isNew){
      el.querySelector('#gArch').addEventListener('click',()=>{G=loadG();G.goals[d.id].archived=!d.archived;G.goals[d.id].updated=Date.now();saveG();closeSheet();toast(d.archived?'Restored':'Archived');render();});
      el.querySelector('#gDel').addEventListener('click',()=>el.querySelector('#gDelC').hidden=false);
      el.querySelector('#gDelN').addEventListener('click',()=>el.querySelector('#gDelC').hidden=true);
      el.querySelector('#gDelY').addEventListener('click',()=>{G=loadG();delete G.goals[d.id];G.logs=G.logs.filter(l=>l.goal!==d.id);saveG();closeSheet();toast('Deleted');render();});
    }
    if(isNew) el.querySelector('#gTitle').focus();
  });
}

// ---------- group editor
function editGroup(g){
  const isNew=!g; const d=g?JSON.parse(JSON.stringify(g)):{id:uid('p'),cls,name:'',students:[]}; const sel=d.students.slice();
  openSheet(`<h2>${isNew?'New group':'Edit group'}</h2>
    <div class="field"><label for="pName">Group name</label><input id="pName" type="text" value="${esc(d.name)}" placeholder="e.g. Fractions group" enterkeyhint="done"></div>
    <div class="field"><span class="lbl">Students</span>${pickerHTML(sel,false)}</div>
    <div id="pErr" class="note bad" hidden style="margin:0 6px"></div>
    ${isNew?'':`<div class="bar" style="padding:6px"><button class="plain" id="pDel" style="color:var(--not)">Delete group</button><span class="hint">Goals and logs aren't affected.</span></div>`}
    <div class="sticky-actions"><button class="ghost" id="pCancel">Cancel</button><button class="primary" id="pSave">${isNew?'Add group':'Save'}</button></div>`,
  el=>{
    wirePicker(el,sel);
    el.querySelector('#pCancel').addEventListener('click',closeSheet);
    el.querySelector('#pName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();}});
    el.querySelector('#pSave').addEventListener('click',()=>{
      d.name=el.querySelector('#pName').value.trim(); d.students=sel.slice(); d.updated=Date.now();
      if(!d.name){const x=el.querySelector('#pErr');x.textContent='Give the group a name.';x.hidden=false;return;}
      G=loadG(); G.groups[d.id]=d; saveG(); closeSheet(); toast(isNew?'Group added':'Saved'); render();});
    if(!isNew) el.querySelector('#pDel').addEventListener('click',()=>{G=loadG();delete G.groups[d.id];saveG();closeSheet();toast('Group deleted');render();});
  });
}

// ---------- one student's settings and status on a goal
function perSheet(g,sid,after){
  const o=Object.assign({},per(g,sid)), nm=esc(sname(sid)), st=o.status||'active';
  openSheet(`<h2>${nm}</h2><div class="hint" style="padding:0 6px">${esc(g.title)}</div>
    <div class="field"><span class="lbl">Status</span><div class="seg" id="pStat">
      <button type="button" data-v="active" aria-pressed="${st==='active'}">Active</button>
      <button type="button" data-v="met" aria-pressed="${st==='met'}">Met</button>
      <button type="button" data-v="paused" aria-pressed="${st==='paused'}">Paused</button></div></div>
    <div class="field" id="pMetW"><label for="pMet">Met on</label><input id="pMet" type="date" value="${esc(o.metDate||today())}" max="${today()}" style="width:180px"></div>
    <p class="hint" style="padding:0 6px">Met and Paused take ${nm} off the Due list. History is kept, and you can set Active again any time.</p>
    <div class="field"><label for="pCad">Check for ${nm}</label><select id="pCad"><option value="">Same as goal (${esc(cadName(g.cadence))})</option>${CADENCE.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select></div>
    ${g.kind==='trials'?`<div class="field"><label for="pTot">Trials for ${nm}</label><input id="pTot" type="number" min="1" max="50" value="${esc(o.defTotal||'')}" placeholder="Same as goal (${g.defTotal||5})" style="width:220px"></div>`:''}
    <div class="field"><span class="lbl">Dates for ${nm} (blank = same as goal)</span><div class="bar"><input id="pStart" type="date" value="${esc(o.start||'')}" aria-label="Start date"><span class="hint">to</span><input id="pEnd" type="date" value="${esc(o.end||'')}" aria-label="End date"></div></div>
    <div id="pErr" class="note bad" hidden style="margin:0 6px"></div>
    <div class="sticky-actions"><button class="ghost" id="pCancel">Cancel</button><button class="primary" id="pSave">Save</button></div>`,
  el=>{let stat=st;
    const ui=()=>{el.querySelectorAll('#pStat button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===stat));el.querySelector('#pMetW').hidden=stat!=='met';};
    ui(); el.querySelector('#pCad').value=o.cadence||'';
    el.querySelector('#pStat').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){stat=b.dataset.v;ui();}});
    el.querySelector('#pCancel').addEventListener('click',closeSheet);
    el.querySelector('#pSave').addEventListener('click',()=>{
      const n={}, cad=el.querySelector('#pCad').value, tot=el.querySelector('#pTot'), s0=el.querySelector('#pStart').value, e0=el.querySelector('#pEnd').value;
      if(cad) n.cadence=cad;
      if(tot&&tot.value) n.defTotal=Math.max(1,Math.min(50,+tot.value||1));
      if(s0) n.start=s0; if(e0) n.end=e0;
      if((s0||g.start)&&(e0)&&e0<(s0||g.start||'')){const x=el.querySelector('#pErr');x.textContent='The end date is before the start date.';x.hidden=false;return;}
      if(stat!=='active') n.status=stat; if(stat==='met') n.metDate=el.querySelector('#pMet').value||today();
      G=loadG(); const gg=G.goals[g.id]; gg.per=gg.per||{};
      if(Object.keys(n).length) gg.per[sid]=n; else delete gg.per[sid];
      gg.updated=Date.now(); saveG(); closeSheet(); toast(stat==='met'?'Marked met':stat==='paused'?'Paused':'Saved'); (after||render)();});
  });
}

// ---------- logging: one row per student, all saved together
function logSheet(g,sids,after){
  const rows=sids.map(sid=>({sid,correct:null,total:eff(g,sid).defTotal,yes:null,note:''}));
  let where=(P.where&&P.where[g.id])!==undefined?P.where[g.id]:(P.lastWhere||'');
  const grps=Object.values(G.groups).filter(x=>x.cls===cls&&x.students.some(s=>g.students.includes(s)));
  openSheet(`<h2>${esc(g.title)}</h2>
    ${g.criteria?`<div class="crit" style="margin:0 6px">${esc(g.criteria)}</div>`:''}
    <div class="field"><label for="lDate">Date</label><input id="lDate" type="date" value="${today()}" max="${today()}" style="width:180px"></div>
    <div class="field"><span class="lbl">Where (optional)</span><div class="chips" id="lWhere"></div></div>
    <div id="lRows" style="display:flex;flex-direction:column;gap:8px;padding:0 6px"></div>
    ${g.students.length>sids.length?`<div class="chips" style="padding:0 6px" id="lAdd"><span class="lbl" style="flex-basis:100%">Add students to this log</span>
      ${grps.map(x=>`<button type="button" class="grp" data-grp="${esc(x.id)}">+ ${esc(x.name)}</button>`).join('')}
      ${g.students.filter(s=>!sids.includes(s)).map(s=>`<button type="button" data-sid="${esc(s)}">+ ${esc(sname(s))}</button>`).join('')}</div>`:''}
    <div class="sticky-actions"><button class="ghost" id="lCancel">Cancel</button><button class="primary" id="lSave">Save</button></div>`,
  el=>{
    const draw=()=>{el.querySelector('#lRows').innerHTML=rows.map((r,i)=>{
      const pct=r.correct!=null&&r.total?Math.round(100*r.correct/r.total)+'%':'';
      const body=g.kind==='trials'?`<span class="step" data-i="${i}"><button type="button" data-a="c-">−</button><output>${r.correct==null?'–':r.correct}</output><button type="button" data-a="c+">+</button></span>
          <span class="hint">of</span><span class="step" data-i="${i}"><button type="button" data-a="t-">−</button><output>${r.total}</output><button type="button" data-a="t+">+</button></span><span class="pct">${pct}</span>`
        :g.kind==='yesno'?`<span class="yn" data-i="${i}"><button type="button" data-v="1" aria-pressed="${r.yes===true}">Met</button><button type="button" data-v="0" aria-pressed="${r.yes===false}">Not met</button></span>`:'';
      return `<div class="logrow"><div class="top"><span class="nm">${esc(sname(r.sid))}</span>${body}</div>
        <input type="text" data-note="${i}" value="${esc(r.note)}" placeholder="Note (optional)" enterkeyhint="done"></div>`;}).join('');};
    draw();
    const opts=whereOptions(); if(where&&!opts.includes(where)) opts.push(where);
    const drawWhere=()=>{el.querySelector('#lWhere').innerHTML=opts.map(w=>`<button type="button" data-w="${esc(w)}" aria-pressed="${w===where}">${esc(w)}</button>`).join('')+`<button type="button" class="grp" data-w="__other">Other…</button>`;};
    drawWhere();
    el.querySelector('#lWhere').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;
      if(b.dataset.w==='__other'){const inp=document.createElement('input');inp.type='text';inp.placeholder='Where?';inp.enterKeyHint='done';inp.style.minWidth='160px';
        b.replaceWith(inp);inp.focus();inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();inp.blur();}});
        inp.addEventListener('blur',()=>{const v=inp.value.trim();if(v){if(!opts.includes(v))opts.push(v);where=v;}drawWhere();},{once:true});return;}
      where=where===b.dataset.w?'':b.dataset.w; drawWhere();});
    el.querySelector('#lRows').addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return; const box=b.closest('[data-i]'); if(!box) return; const r=rows[+box.dataset.i];
      if(b.dataset.a){const a=b.dataset.a;
        if(a==='c+') r.correct=Math.min(r.total,(r.correct==null?0:r.correct)+1);
        if(a==='c-') r.correct=r.correct==null?0:Math.max(0,r.correct-1);
        if(a==='t+') r.total=Math.min(50,r.total+1);
        if(a==='t-'){r.total=Math.max(1,r.total-1); if(r.correct!=null) r.correct=Math.min(r.correct,r.total);}}
      if(b.dataset.v){const v=b.dataset.v==='1'; r.yes=r.yes===v?null:v;}
      draw();
    });
    el.querySelector('#lRows').addEventListener('input',e=>{const i=e.target.dataset.note; if(i!=null) rows[+i].note=e.target.value;});
    el.querySelector('#lRows').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();e.target.blur();}});
    const add=el.querySelector('#lAdd');
    if(add) add.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      const more=b.dataset.grp?G.groups[b.dataset.grp].students.filter(s=>g.students.includes(s)):[b.dataset.sid];
      more.forEach(s=>{if(!rows.some(r=>r.sid===s)&&!status(g,s).done) rows.push({sid:s,correct:null,total:eff(g,s).defTotal,yes:null,note:''});});
      add.querySelectorAll('[data-sid]').forEach(x=>{if(rows.some(r=>r.sid===x.dataset.sid)) x.remove();}); draw();});
    el.querySelector('#lCancel').addEventListener('click',closeSheet);
    el.querySelector('#lSave').addEventListener('click',()=>{
      const date=el.querySelector('#lDate').value||today(); let n=0;
      G=loadG();
      rows.forEach(r=>{
        const note=r.note.trim(), base={id:uid('l'),goal:g.id,sid:r.sid,date,t:Date.now(),note}; if(where) base.where=where;
        if(g.kind==='trials'&&r.correct!=null){G.logs.push(Object.assign(base,{kind:'trials',correct:r.correct,total:r.total}));n++;}
        else if(g.kind==='yesno'&&r.yes!=null){G.logs.push(Object.assign(base,{kind:'yesno',yes:r.yes}));n++;}
        else if(note){G.logs.push(Object.assign(base,{kind:'note'}));n++;}
      });
      if(!n){toast(g.kind==='note'?'Write a note for at least one student.':'Enter a result for at least one student.');return;}
      saveG(); P.lastWhere=where; P.where=P.where||{}; P.where[g.id]=where; savePrefs(); closeSheet(); toast('Logged '+n); (after||render)();
    });
  });
}

// ---------- history for one student on one goal
function historySheet(g,sid,after){
  const draw=el=>{const ls=logsFor(g.id,sid).slice().reverse();
    el.querySelector('#hList').innerHTML=ls.length?ls.map(l=>`<div class="h"><span class="d">${esc(short(l.date))}</span><span class="r">${esc(resText(l))}${l.kind==='trials'&&l.total?' <small>'+Math.round(100*l.correct/l.total)+'%</small>':''}</span><span class="t">${l.where?'<span class="tag" style="margin-right:6px">'+esc(l.where)+'</span>':''}${esc(l.note||'')}</span><button type="button" class="x" data-del="${esc(l.id)}">Delete</button></div>`).join('')
      :'<div class="empty">No entries yet.</div>';};
  openSheet(`<h2>${esc(sname(sid))}</h2><div class="hint" style="padding:0 6px">${esc(g.title)}</div>
    <div class="hist" id="hList" style="padding:0 6px"></div>
    <div class="sticky-actions"><button class="ghost" id="hClose">Close</button><button class="primary" id="hLog">Log</button></div>`,
  el=>{draw(el);
    el.querySelector('#hList').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;
      if(b.classList.contains('sure')){G=loadG();G.logs=G.logs.filter(l=>l.id!==b.dataset.del);saveG();draw(el);}
      else{b.classList.add('sure');b.textContent='Tap to delete';setTimeout(()=>{if(b.isConnected){b.classList.remove('sure');b.textContent='Delete';}},3000);}});
    el.querySelector('#hClose').addEventListener('click',()=>{closeSheet();(after||render)();});
    el.querySelector('#hLog').addEventListener('click',()=>logSheet(g,[sid],after));
  });
}
