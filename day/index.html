<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e7a46">
<title>Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="../shared/classroom.css">
<style>
/* The day is the hub: week strip, the day's periods, then small tiles that open detail sheets */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{gap:12px;padding-top:0;max-width:900px}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.iconbtn{min-height:44px;min-width:44px;padding:0;font-size:22px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.week{display:flex;gap:6px;align-items:stretch}
.week .nav{min-width:40px;padding:0;background:none;border:0;color:var(--accent);font-size:26px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;min-height:56px;padding:4px 2px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--fg);font-weight:500}
.wd small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wd b{font-size:18px}
.wd i{font-style:normal;font-size:11px;color:var(--muted);min-height:14px}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--onaccent)}
.wd[aria-pressed="true"] small,.wd[aria-pressed="true"] i{color:var(--onaccent)}
.wd.today b{text-decoration:underline;text-underline-offset:3px}
.wd.off{opacity:.55}
#view{display:flex;flex-direction:column;gap:12px}
.dayh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayh h1{flex:1;font-size:21px}
.dayh .seg button{min-height:38px;font-size:14px;padding:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.meta{font-size:14px;color:var(--muted)}
.per{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg);font-weight:400;min-height:0;align-items:start}
.per .tm{font:600 14px var(--mono);color:var(--muted);padding-top:2px}
.per .tm small{display:block;font-size:12px;font-weight:400}
.per .bd{display:flex;flex-direction:column;gap:4px;min-width:0}
.per .ttl{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.per .ttl b{font-size:16px}
.per .ttl span{color:var(--muted);font-size:14px}
.per .les{font-size:15px}
.per .les.none{color:var(--muted);font-style:italic}
.per .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.per.quiet{padding:6px 12px;background:transparent;border-style:dashed}
.per.quiet .ttl b{font-weight:500;color:var(--muted)}
.per.now{border:2px solid var(--accent)}
.chip{font:600 12px var(--sans);border-radius:999px;padding:3px 9px;border:1.5px solid var(--line);color:var(--fg);background:var(--sunk);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.sug{border-style:dashed;background:none;color:var(--muted)}
.chip.keep{border-color:var(--part);color:var(--part);background:none}
.chip.done{border-color:var(--got);color:var(--got);background:none}
.chip.cont{border-color:var(--accent);color:var(--accent);background:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:620px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg);min-height:0;font-weight:500;text-align:left}
.tile b{font:700 26px var(--mono)}
.tile span{font-size:13px;color:var(--muted)}
.tile.alert b{color:var(--not)}
.off-card{text-align:center;padding:28px 12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.lbl{font-weight:600;font-size:15px}
.sheet input[type=text],.sheet input[type=url],.sheet textarea{width:100%}
input[type=url]{font:500 16px var(--sans);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-width:0}
.sheet textarea{font:15px/1.4 var(--sans);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-height:70px}
.lesopt{display:flex;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);font-size:15px}
.lesopt input[type=radio]{width:22px;height:22px;flex-shrink:0}
.lesopt span{flex:1;min-width:0}
.lesopt small{color:var(--muted)}
.pr{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 2px;flex-wrap:wrap}
.pr .t{flex:1;min-width:200px;font-size:15px}
.pr .t small{display:block;color:var(--muted)}
.pr button{min-height:38px;padding:0 12px;font-size:14px}
.mrow{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding:8px 2px}
.mrow .nums{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{min-width:44px;min-height:44px;padding:0;font-size:20px;background:var(--card);border:1.5px solid var(--line);color:var(--fg)}
.step output{min-width:36px;text-align:center;font:700 18px var(--mono)}
.todo{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 2px;font-size:16px}
.todo input{width:24px;height:24px;flex-shrink:0}
.todo span{flex:1}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo small{color:var(--muted)}
.studs{display:flex;flex-wrap:wrap;gap:6px}
.studs button{min-height:42px;padding:0 12px;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font-weight:500}
.studs button[aria-pressed="true"]{background:var(--not);border-color:var(--not);color:var(--onaccent)}
.sticky-actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 6px calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.sticky-actions button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 15px var(--sans)}
a.lnk{color:var(--accent);word-break:break-all}
#printout{display:none}
@media print{
  html,body{height:auto;background:#fff}
  body>*{display:none!important}
  #printout{display:block!important;font:12px var(--sans);color:#000}
  #printout h1{font-size:18px;margin:0 0 6px}
  #printout h2{font-size:14px;margin:12px 0 4px}
  #printout .pp{border-top:1px solid #999;padding:5px 0;break-inside:avoid;display:grid;grid-template-columns:90px 1fr;gap:2px 10px}
  #printout .pp .tm{font-variant-numeric:tabular-nums}
  #printout .pg{display:flex;gap:8px;font-size:11px}
  #printout .pg span:first-child{flex:1}
  #printout .bx{white-space:nowrap;font-size:13px}
  #printout ul{margin:2px 0;padding-left:16px}
  #printout .lines{height:22px;border-bottom:1px solid #bbb}
  #printout .big{height:110px;background:repeating-linear-gradient(#fff 0 22px,#bbb 22px 23px)}
}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="week" id="week"></div>
  </div>
  <div id="view"></div>
</main>
<div class="scrim" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="printout"></div>
<script src="../shared/classroom.js"></script>
<script src="../shared/iepcore.js"></script>
<script src="day.js"></script>
<script src="../shared/version.js"></script>
<script src="../shared/app.js"></script>
</body>
</html>
